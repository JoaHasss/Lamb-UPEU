server:
  port: 18080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:18180/realms/lamb
  cloud:
    loadbalancer:
      cache:
        ttl: 5s
    gateway:
      server:
        webmvc:
          routes:
            - id: lamb-personas
              uri: lb://lamb-personas-ms
              predicates:
                - Path=/api/v1/persona/**
            - id: lamb-personas-relacion-responsable
              uri: lb://lamb-personas-ms
              predicates:
