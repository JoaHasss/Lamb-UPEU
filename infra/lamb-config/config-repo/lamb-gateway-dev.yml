            - id: lamb-ingresos-pagos-tarifarios-programa
              uri: lb://ingresos-pagos-ms
              predicates:
                - Path=/api/v1/tarifarios-programa/**
            - id: lamb-ingresos-pagos-tipos-cambio
              uri: lb://ingresos-pagos-ms
              predicates:
                - Path=/api/v1/tipos-cambio/**
            # lamb-finanzas-ms es dueno canonico de Pago/ConceptoPago/MetodoPago/EstadoPago (saga matricula-finanzas).
            - id: lamb-finanzas-pagos
              uri: lb://lamb-finanzas-ms
              predicates:
                - Path=/api/v1/pagos/**
            - id: lamb-finanzas-catalogos-tarifas
              uri: lb://lamb-finanzas-ms
              predicates:
                - Path=/api/v1/catalogos-tarifas/**
            - id: lamb-finanzas-saldo-estudiante
              uri: lb://lamb-finanzas-ms
              predicates:
                - Path=/api/v1/saldo-estudiante/**
            - id: lamb-finanzas-calendario-planes
              uri: lb://lamb-finanzas-ms
              predicates:
                - Path=/api/v1/calendario-planes/**
            - id: lamb-finanzas-descuentos-becas
              uri: lb://lamb-finanzas-ms
              predicates:
                - Path=/api/v1/descuentos-becas/**
            - id: lamb-finanzas-convenios-institucionales
              uri: lb://lamb-finanzas-ms
              predicates:
                - Path=/api/v1/convenios-institucionales/**
            - id: lamb-finanzas-cobros
              uri: lb://lamb-finanzas-ms
              predicates:
                - Path=/api/v1/cobros/**
            - id: lamb-finanzas-comprobantes
              uri: lb://lamb-finanzas-ms
              predicates:
                - Path=/api/v1/comprobantes/**
            - id: lamb-finanzas-control-cierre
              uri: lb://lamb-finanzas-ms
              predicates:
                - Path=/api/v1/control-cierre/**
            - id: lamb-finanzas-reembolsos-cancelaciones
              uri: lb://lamb-finanzas-ms
              predicates:
                - Path=/api/v1/reembolsos-cancelaciones/**
            # Una ruta por microservicio: /ms/<servicio>/api/v1/... -> /api/v1/... en ese servicio.
            # Evita los choques de rutas repetidas entre servicios (/cursos, /pagos, /vistas).
            - id: ms-personas
              uri: lb://lamb-personas-ms
              predicates:
                - Path=/ms/personas/**
              filters:
                - StripPrefix=2
            - id: ms-institucional
              uri: lb://lamb-institucional-ms
              predicates:
                - Path=/ms/institucional/**
              filters:
                - StripPrefix=2
            - id: ms-admision
              uri: lb://lamb-admision-ms
              predicates:
                - Path=/ms/admision/**
              filters:
                - StripPrefix=2
            - id: ms-curriculo
              uri: lb://lamb-curriculo-ms
              predicates:
                - Path=/ms/curriculo/**
              filters:
                - StripPrefix=2
            - id: ms-planificacion
              uri: lb://lamb-planificacion-ms
              predicates:
                - Path=/ms/planificacion/**
              filters:
                - StripPrefix=2
            - id: ms-matricula
              uri: lb://lamb-matricula-ms
              predicates:
                - Path=/ms/matricula/**
              filters:
                - StripPrefix=2
            - id: ms-evaluacion
              uri: lb://lamb-evaluacion-ms
              predicates:
                - Path=/ms/evaluacion/**
              filters:
                - StripPrefix=2
            - id: ms-trayectoria
              uri: lb://lamb-trayectoria-ms
              predicates:
                - Path=/ms/trayectoria/**
              filters:
                - StripPrefix=2
            - id: ms-finanzas
              uri: lb://lamb-finanzas-ms
              predicates:
                - Path=/ms/finanzas/**
              filters:
                - StripPrefix=2
            - id: ms-ingresos-pagos
              uri: lb://ingresos-pagos-ms
              predicates:
                - Path=/ms/ingresos-pagos/**
              filters:
                - StripPrefix=2
            - id: ms-lms
              uri: lb://lms-ms
              predicates:
                - Path=/ms/lms/**
              filters:
                - StripPrefix=2
            # ======================================================================================
            # PASO 6 de 15: ruta del gateway para el ms del examen
            # ======================================================================================
            # AGREGAR al final de la lista (debajo de ms-lms), NO encima de otra ruta.
            # El "-" va en la MISMA columna que los otros "- id:" (12 espacios).
            # CAMBIAR:
            #   id   -> <recurso>                              ej. reserva
            #   uri  -> lb://<tunombre>-<recurso>-ms            ej. lb://joaquinsanchez-reserva-ms
            #   Path -> /api/v1/<recursos>/**                   ej. /api/v1/reservas/**
            # OJO: SIN "filters: StripPrefix". Quitaria /api/v1 y el servicio responderia 404.
            # Verificar: http://localhost:18888/lamb-gateway/dev (sin 500), reiniciar el gateway y
            #   probar http://localhost:18080/api/v1/<recursos>  -> 200
            # SIGUIENTE: SecurityConfig.java del gateway (PASO 7)
            - id: notificacion
              uri: lb://joaquinsanchez-notificacion-ms
              predicates:
                - Path=/api/v1/notificaciones/**

eureka:
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
  client:
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: http://localhost:18761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
