            - id: lamb-ingresos-pagos-pagos-concepto
              uri: lb://ingresos-pagos-ms
              predicates:
                - Path=/api/v1/pagos-concepto/**
            - id: lamb-ingresos-pagos-bitacoras-auditoria-pago
              uri: lb://ingresos-pagos-ms
              predicates:
                - Path=/api/v1/bitacoras-auditoria-pago/**
            - id: lamb-ingresos-pagos-cajas
              uri: lb://ingresos-pagos-ms
              predicates:
                - Path=/api/v1/cajas/**
            - id: lamb-ingresos-pagos-entidades-financieras
              uri: lb://ingresos-pagos-ms
              predicates:
                - Path=/api/v1/entidades-financieras/**
            - id: lamb-ingresos-pagos-financiamientos-educativos
              uri: lb://ingresos-pagos-ms
              predicates:
                - Path=/api/v1/financiamientos-educativos/**
            - id: lamb-ingresos-pagos-logs-transaccion-pasarela
              uri: lb://ingresos-pagos-ms
              predicates:
                - Path=/api/v1/logs-transaccion-pasarela/**
            - id: lamb-ingresos-pagos-notas-credito-debito
              uri: lb://ingresos-pagos-ms
              predicates:
                - Path=/api/v1/notas-credito-debito/**
            - id: lamb-ingresos-pagos-pagadores-terceros
              uri: lb://ingresos-pagos-ms
              predicates:
                - Path=/api/v1/pagadores-terceros/**
            - id: lamb-ingresos-pagos-plantillas-notificacion
              uri: lb://ingresos-pagos-ms
              predicates:
