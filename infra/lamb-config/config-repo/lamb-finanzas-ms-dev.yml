server:
  port: 8087

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:18180/realms/lamb
  datasource:
    url: jdbc:postgresql://localhost:15457/lamb_finanzas_db
    username: lamb
    password: lamb
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:18092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: lamb-finanzas-ms
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: pe.edu.upeu.lamb.finanzas.event.MatriculaConfirmadaEvento
        spring.json.trusted.packages: pe.edu.upeu.lamb.finanzas.event
        spring.json.use.type.headers: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    pe.edu.upeu.lamb.finanzas: DEBUG

app:
  kafka:
    topic:
      matricula: matricula-eventos
      pago-aceptado: pago-aceptado-eventos

# Credenciales de prueba (sandbox) de Mercado Pago. Public key no es secreta.
# access-token SI es secreto: reemplazar el placeholder de abajo con el token real
# (ojito en el panel de Mercado Pago) solo en tu copia local, nunca commitear el valor real.
mercadopago:
  public-key: APP_USR-849c20b2-4269-4196-aded-4e3d353529a1
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:CAMBIAR_ACCESS_TOKEN_AQUI}
  # Checkout Pro: a donde vuelve el navegador segun el resultado. pagoId se agrega solo
  # (PasarelaPagoService.crearPreferencia) para que esa pantalla sepa que pago confirmar.
  back-url-success: http://localhost:4200/pagos/resultado
  back-url-pending: http://localhost:4200/pagos/resultado
  back-url-failure: http://localhost:4200/pagos/resultado
  # Localhost no es alcanzable desde Mercado Pago: el webhook no va a llegar en dev. Se confirma
  # el pago manualmente via POST /api/v1/pagos/{id}/confirmar-mercadopago en su lugar.
  notification-url: http://localhost:4200/

eureka:
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:18761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
