<div class="pagina">
  <h2>Ampliación de plazo de matrícula</h2>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      Cronograma
      <select formControlName="idCronograma">
        <option [ngValue]="null" disabled>Seleccione un cronograma...</option>
        @for (c of cronogramas(); track c.id) {
          <option [ngValue]="c.id">{{ c.periodo }} · {{ c.descripcion }}</option>
        }
      </select>
    </label>
    <label>
      Fecha ampliada
      <input type="date" formControlName="fechaAmpliada" />
    </label>
    <label>
      Motivo
      <input type="text" formControlName="motivo" />
    </label>
    <label>
      Autorizado por
      <input type="text" formControlName="autorizadoPor" />
    </label>

    <button type="submit">Guardar</button>
  </form>
</div>
