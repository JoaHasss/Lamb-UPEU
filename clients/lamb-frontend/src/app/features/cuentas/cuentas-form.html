<div class="pagina">
  <h2>Cuentas de estudiante</h2>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      Persona
      <select formControlName="idPersona">
        <option [ngValue]="null" disabled>Seleccione una persona...</option>
        @for (p of personas(); track p.id) {
          <option [ngValue]="p.id">{{ p.apellidos }}, {{ p.nombres }} ({{ p.numeroDocumento }})</option>
        }
      </select>
    </label>
    @if (id) {
      <p>
        Saldo a favor del estudiante: <strong>S/ {{ form.controls.saldoActual.value }}</strong><br />
        <small>No se edita a mano: aumenta con abonos y ajustes manuales, y se descuenta con cada pago aprobado. Si es negativo, el estudiante debe ese monto.</small>
      </p>
    } @else {
      <label>
        Saldo a favor inicial (S/): lo que le abonas al estudiante (opcional)
        <input type="number" step="0.01" formControlName="saldoActual" />
      </label>
    }

    <button type="submit">Guardar</button>
  </form>
</div>
