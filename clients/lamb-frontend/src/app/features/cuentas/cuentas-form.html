<div class="pagina">
  <h2>Cuentas de estudiante</h2>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      Persona
      <select formControlName="idPersona">
        <option [ngValue]="null" disabled>Seleccione una persona...</option>
        @for (p of personas(); track p.id) {
          <option [ngValue]="p.id">{{ p.apellidos }}, {{ p.nombres }} ({{ p.numeroDocumento }})</option>
        }
      </select>
    </label>
    <label>
      Saldo actual (S/), lo que adeuda el estudiante
      <input type="number" step="0.01" formControlName="saldoActual" />
    </label>

    <button type="submit">Guardar</button>
  </form>
</div>
