<div class="pagina">
  <h2>ajustes-manuales</h2>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      ID Cuenta
      <input type="number" formControlName="idCuenta" />
    </label>
    <label>
      Monto (positivo suma saldo a favor, negativo lo descuenta)
      <input type="number" formControlName="monto" step="0.01" />
    </label>
    <label>
      Motivo
      <input type="text" formControlName="motivo" />
    </label>
    <label>
      Autorizado por
      <input type="text" formControlName="autorizadoPor" />
    </label>
    <label>
      Fecha ajuste
      <input type="datetime-local" formControlName="fechaAjuste" />
    </label>

    <button type="submit">Guardar</button>
  </form>
</div>
