<div class="pagina">
  <h2>Conceptos de pago</h2>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      Categoría
      <select formControlName="idCategoria">
        <option [ngValue]="null" disabled>Seleccione una categoría...</option>
        @for (c of categorias(); track c.id) {
          <option [ngValue]="c.id">{{ c.nombre }}</option>
        }
      </select>
    </label>
    <label>
      Nombre
      <input type="text" formControlName="nombre" placeholder="Constancia de estudios" />
    </label>
    <label>
      Monto (S/)
      <input type="number" step="0.01" min="0" formControlName="monto" />
    </label>
    <label>
      Vigente desde
      <input type="date" formControlName="vigenciaDesde" />
    </label>
    <label>
      Vigente hasta (opcional)
      <input type="date" formControlName="vigenciaHasta" />
    </label>

    <button type="submit">Guardar</button>
  </form>
</div>
