<div class="pagina">
  <h2>Variación de matrícula</h2>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      Cronograma
      <select formControlName="idCronograma">
        <option [ngValue]="null" disabled>Seleccione un cronograma...</option>
        @for (c of cronogramas(); track c.id) {
          <option [ngValue]="c.id">{{ c.periodo }} · {{ c.descripcion }}</option>
        }
      </select>
    </label>
    <label>
      Tipo
      <input type="text" formControlName="tipo" />
    </label>
    <label>
      Fecha inicio
      <input type="date" formControlName="fechaInicio" />
    </label>
    <label>
      Fecha fin
      <input type="date" formControlName="fechaFin" />
    </label>
    <label>
      Descripción
      <input type="text" formControlName="descripcion" />
    </label>

    <button type="submit">Guardar</button>
  </form>
</div>
