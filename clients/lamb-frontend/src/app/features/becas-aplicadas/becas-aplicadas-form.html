<div class="pagina">
  <h2>Becas aplicadas</h2>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      Persona
      <select formControlName="idPersona">
        <option [ngValue]="null" disabled>Seleccione una persona...</option>
        @for (p of personas(); track p.id) {
          <option [ngValue]="p.id">{{ p.apellidos }}, {{ p.nombres }} ({{ p.numeroDocumento }})</option>
        }
      </select>
    </label>
    <label>
      Tipo de beca
      <select formControlName="idTipoBeca">
        <option [ngValue]="null" disabled>Seleccione un tipo de beca...</option>
        @for (t of tiposBeca(); track t.id) {
          <option [ngValue]="t.id">{{ t.nombre }}</option>
        }
      </select>
    </label>
    <label>
      Porcentaje (%)
      <input type="number" step="0.01" min="1" max="100" formControlName="porcentaje" />
    </label>
    <label>
      Rige desde
      <input type="date" formControlName="fechaInicio" />
    </label>

    <button type="submit">Guardar</button>
  </form>
</div>
