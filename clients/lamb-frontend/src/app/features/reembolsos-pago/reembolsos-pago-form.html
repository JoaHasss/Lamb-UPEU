<div class="pagina">
  <h2>Reembolsos</h2>

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="guardar()">
    <label>
      Solicitud de devolución
      <select formControlName="idSolicitudDevolucion" (change)="alElegirSolicitud()">
        <option [ngValue]="null" disabled>Seleccione una solicitud...</option>
        @for (s of solicitudes(); track s.id) {
          <option [ngValue]="s.id">
            #{{ s.id }} · Pago {{ s.idPago }} · S/ {{ s.montoSolicitado }} · {{ s.estado | sinGuion }} · {{ s.motivo }}
          </option>
        }
      </select>
    </label>
    <label>
      Cuenta del estudiante
      <select formControlName="idCuentaEstudiante">
        <option [ngValue]="null" disabled>Seleccione una cuenta...</option>
        @for (c of cuentas(); track c.id) {
          <option [ngValue]="c.id">Cuenta #{{ c.id }} · Persona {{ c.idPersona }} · saldo S/ {{ c.saldoActual }}</option>
        }
      </select>
    </label>
    <label>
      Monto reembolsado (S/)
      <input type="number" step="0.01" min="0.01" formControlName="montoReembolsado" />
    </label>
    <label>
      Fecha del reembolso
      <input type="datetime-local" formControlName="fecha" />
    </label>

    <button type="submit">Guardar</button>
  </form>
</div>
